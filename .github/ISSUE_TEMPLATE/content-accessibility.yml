name: Content or accessibility issue
description: Report unclear copy, accessibility friction, metadata problems, or other public-content quality issues.
title: "[content] "
labels: []
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Accessibility
        - Public copy
        - SEO or metadata
        - Social sharing preview
        - Documentation
        - Other website content
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page, section, or file
      placeholder: Homepage hero, setup section, README.md, PRODUCT.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear, inaccessible, or incorrect?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: User impact
      description: Explain what a visitor cannot understand, perceive, operate, or verify because of the problem.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Optional. A concrete replacement is welcome, but not required.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, tokens, cookies, private documents, and unrelated personal information.
          required: true
